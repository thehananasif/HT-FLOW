<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>HT Flow</title>
    <style>
      html,
      body {
        margin: 0;
        background: #000;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #000;
        color: #8d93a0;
        font:
          12px system-ui,
          sans-serif;
      }
      #boot-splash img.logo {
        height: 220px;
        width: auto;
      }
      #boot-splash img.icon {
        width: 40px;
        height: 40px;
        border-radius: 9px;
      }
      #boot-splash .bar {
        width: 120px;
        height: 2px;
        background: #1c1c1c;
        overflow: hidden;
        border-radius: 2px;
      }
      #boot-splash .bar i {
        display: block;
        width: 40%;
        height: 100%;
        background: #20c77a;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(300%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .bar i {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash" data-testid="boot-splash" role="status" aria-label="Loading HT Flow">
        <img class="logo" src="/brand/hanan-trade-logo-transparent.webp" alt="HANAN TRADE" />
        <img class="icon" src="/brand/icon-128.png" alt="" />
        <div class="bar"><i></i></div>
        <div>Loading HT Flow…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
