[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/core-types",
    "crates/auth",
    "crates/vault",
    "crates/connectors/binance",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Hanan Asif"]
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tracing = "0.1"
rand = "0.8"
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "serde"] }

htflow-core-types = { path = "crates/core-types" }
htflow-auth = { path = "crates/auth" }
htflow-vault = { path = "crates/vault" }
htflow-connector-binance = { path = "crates/connectors/binance" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "abort"

[profile.dev.package.argon2]
opt-level = 3
