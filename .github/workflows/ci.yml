name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Checks & tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: ESLint
        run: pnpm lint
      - name: Prettier
        run: pnpm format:check
      - name: Unit tests (Vitest)
        run: pnpm test
      - name: Build UI (needed by tauri::generate_context!)
        run: pnpm build:web
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace
      - name: Install Playwright Chromium
        run: pnpm --filter @htflow/desktop exec playwright install chromium
      - name: E2E (Playwright)
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/desktop/playwright-report
          retention-days: 7

  build-windows:
    name: Build Windows x64 (.exe + NSIS installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - run: pnpm install --frozen-lockfile
      - name: Tauri build (NSIS, per-user install)
        run: pnpm --filter @htflow/desktop tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: HTFlow-windows-x64
          path: |
            target/release/htflow-desktop.exe
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
